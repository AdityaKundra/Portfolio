<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('portfolio-theme');
          var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          var size = localStorage.getItem('portfolio-text-size');
          if (size) document.documentElement.dataset.textSize = size;
        } catch (e) {}
      })();
    </script>
    <!--meta:start-->
    <title>Aditya Kundra, Software Engineer</title>
    <!--meta:end-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
